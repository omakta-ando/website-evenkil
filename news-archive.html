d var(--line);border-radius:16px;padding:22px;min-height:244px;display:flex;flex-direction:column;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}.news-card:hover{transform:translateY(-3px);background:#f3f5ec;border-color:#b9c5af;box-shadow:0 10px 24px #152b2510}.news-card:focus-visible{outline:3px solid #73846a;outline-offset:3px}.card-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:10px;color:#858c82;text-transform:uppercase;letter-spacing:.07em}.region-tag{color:#596f55;background:#edf0e7;padding:6px 9px;border-radius:18px;font-weight:700}.news-card h2{font:600 18px/1.3 Manrope,sans-serif;letter-spacing:-.025em;margin:20px 0 10px}.news-card p{font-size:12px;color:#697168;line-height:1.55;margin:0 0 20px}.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11px;color:#858c82}.card-foot a{font-weight:700;color:#49654e}.card-foot a:hover{color:var(--clay)}.pager{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin-top:28px}.pager button{min-width:40px;min-height:40px;padding:8px 12px;border:1px solid #cbd1c3;border-radius:10px;background:var(--paper);color:#435348;cursor:pointer;transition:background .18s,color .18s,border-color .18s}.pager button:hover:not(:disabled),.pager button.current{background:var(--pine);border-color:var(--pine);color:#f5f3e9}.pager button:disabled{opacity:.42;cursor:not-allowed}.pager .ellipsis{color:var(--muted);padding:0 3px}.page-status{width:100%;text-align:center;font-size:11px;color:var(--muted);margin-top:4px}.empty{grid-column:1/-1;padding:52px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted);background:var(--paper)}.footer{background:var(--pine);color:#d9e0d4;padding:24px 0;font-size:11px}.footer .wrap{display:flex;justify-content:space-between;gap:14px;align-items:center}.footer strong{font:700 15px Manrope,sans-serif;color:var(--paper)}

<script src="news-data.js?v=20261001-5"></script><script>
const manualKey="taezhnaya-nit-manual-news-v1";let manual=[];try{manual=JSON.parse(localStorage.getItem(manualKey)||"[]")}catch(e){}const stories=[...(window.newsStories||[]),...manual];const pageSize=40;let page=1;const grid=document.getElementById('archiveGrid');const pager=document.getElementById('pager');const regionSelect=document.getElementById('archiveRegion');function getRows(){const selected=regionSelect.value;return stories.filter(item=>item.link&&/^https?:\/\//i.test(item.link)&&(selected==='Все регионы'||item.region===selected)).slice().sort((a,b)=>b.date.localeCompare(a.date))}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function button(label,target,disabled=false,current=false){return `<button type="button" data-page="${target}" ${disabled?'disabled':''} class="${current?'current':''}" ${current?'aria-current="page"':''}>${label}</button>`}function render(){const rows=getRows();const totalPages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(Math.max(1,page),totalPages);const visible=rows.slice((page-1)*pageSize,page*pageSize);document.getElementById('resultCount').textContent=`${rows.length} публикаций · ${page} из ${totalPages} страниц`;grid.innerHTML=visible.length?visible.map(s=>`<a class="news-card" href="${esc(s.link)}" target="_blank" rel="noopener noreferrer" aria-label="Открыть публикацию «${esc(s.title)}» на сайте ${esc(s.source)}"><div class="card-meta"><span class="story-date"><span>${new Date(s.date+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</span><span>${new Date(s.date+'T00:00:00').getFullYear()} г.</span></span><span class="region-tag">${esc(s.region)}</span></div><h2>${esc(s.title)}</h2><p>${esc(s.desc)}</p><div class="card-foot"><span>${esc(s.source)}</span></div></a>`).join(''):'<div class="empty">В выбранном регионе пока нет публикаций.</div>';let nums=[];if(totalPages<=7){nums=Array.from({length:totalPages},(_,i)=>i+1)}else{const start=Math.max(2,Math.min(page-2,totalPages-5));nums=[1,'…',...Array.from({length:5},(_,i)=>start+i),'…',totalPages]}pager.innerHTML=button('« Первая',1,page===1)+button('‹ Предыдущая',page-1,page===1)+nums.map(n=>n==='…'?'<span class="ellipsis">…</span>':button(n,n,false,n===page)).join('')+button('Следующая ›',page+1,page===totalPages)+button('Последняя »',totalPages,page===totalPages)+`<div class="page-status">Показаны ${rows.length?((page-1)*pageSize+1):0}–${Math.min(page*pageSize,rows.length)} из ${rows.length}</div>`}pager.addEventListener('click',event=>{const control=event.target.closest('button[data-page]');if(!control||control.disabled)return;page=Number(control.dataset.page);render();document.querySelector('main').scrollIntoView({behavior:'smooth'})});regionSelect.addEventListener('change',()=>{page=1;render()});render();
</script>

name: Website news collection
on:
  schedule:
    - cron: "0 5,11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-news
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out default branch
        id: checkout
        uses: actions/checkout@v4
      - name: Run collector regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Search and update the website feed
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        run: python3 scripts/telegram_news.py --mode collect
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-source-audit
          path: data/news-source-audit.json
          retention-days: 30
      - name: Save deduplication and daily digest state
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if git diff --quiet -- data/telegram-news-state.json news-data.js; then
            echo "No state changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram-news-state.json news-data.js
          git commit -m "Update website news feed and collection state"
          git push

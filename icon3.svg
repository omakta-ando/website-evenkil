<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Иконка: затесь на дереве — двое три дня идут за оленем" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="disc"><circle cx="256" cy="256" r="248"/></clipPath>
    <clipPath id="cutclip"><ellipse cx="192" cy="455" rx="172" ry="445"/></clipPath>
    <radialGradient id="barkbase" cx="40%" cy="32%" r="85%">
      <stop offset="0" stop-color="#6E523F"/>
      <stop offset="0.6" stop-color="#4F382B"/>
      <stop offset="1" stop-color="#2A1D16"/>
    </radialGradient>
    <radialGradient id="wood" cx="42%" cy="38%" r="75%">
      <stop offset="0" stop-color="#F9E9B0"/>
      <stop offset="0.6" stop-color="#ECC972"/>
      <stop offset="1" stop-color="#D6A04D"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="50%">
      <stop offset="0.68" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
    <filter id="fissure" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055 0.0035" numOctaves="5" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.07  0 0 0 0 0.045  0 0 0 0 0.03  6 0 0 0 -2.6"/>
    </filter>
    <filter id="plates" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.012" numOctaves="3" seed="4"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.48  0 0 0 0 0.38  -3 0 0 0 1.15"/>
    </filter>
    <filter id="blur6" x="-20%" y="-10%" width="140%" height="120%"><feGaussianBlur stdDeviation="7"/></filter>
    <!-- вырезанные канавки -->
    <g id="cuts" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M268,160 L82,482" stroke-width="20"/>
      <path d="M283,132 L142,213" stroke-width="15"/>
      <path d="M278,152 L281,272" stroke-width="12"/>
      <path d="M96,546 L272,548" stroke-width="13"/>
      <path d="M96,579 L268,581" stroke-width="12"/>
      <path d="M99,617 L278,618" stroke-width="15"/>
    </g>

  </defs>

  <g clip-path="url(#disc)">
    <!-- кора по всему кругу -->
    <rect width="512" height="512" fill="url(#barkbase)"/>
    <rect width="512" height="512" filter="url(#plates)" opacity=".28"/>
    <rect width="512" height="512" filter="url(#fissure)"/>
    <rect width="512" height="512" fill="url(#vig)"/>

    <g transform="translate(256 256) scale(0.52) translate(-192 -455)">
      <!-- тень от края коры -->
      <ellipse cx="192" cy="470" rx="190" ry="462" fill="#140d08" opacity=".55" filter="url(#blur6)"/>
      <!-- луб и камбий по краю затеси -->
      <ellipse cx="192" cy="455" rx="190" ry="463" fill="#6B3F22"/>
      <ellipse cx="192" cy="455" rx="181" ry="454" fill="#B5773A"/>
      <ellipse cx="192" cy="455" rx="172" ry="445" fill="url(#wood)"/>
      <!-- волокна -->
      <g clip-path="url(#cutclip)" fill="none" stroke="#B9873F" stroke-opacity=".32" stroke-width="3" stroke-linecap="round">
        <path d="M70,40 Q40,300 62,560 T90,880"/><path d="M110,20 Q88,300 108,560 T128,900"/>
        <path d="M150,10 Q140,300 152,560 T160,900"/><path d="M232,10 Q246,300 236,560 T230,900"/>
        <path d="M272,20 Q296,300 280,560 T266,900"/><path d="M312,40 Q338,300 318,560 T300,880"/>
        <!-- внутренняя тень от края коры -->
        <ellipse cx="192" cy="455" rx="172" ry="445" stroke="#3a2312" stroke-opacity=".5" stroke-width="22" transform="translate(7 9)" filter="url(#blur6)"/>
      </g>
      <ellipse cx="192" cy="455" rx="172" ry="445" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
      <!-- щепки -->
      <g fill="none" stroke="#F4E2A4" stroke-width="6" stroke-linecap="round" stroke-opacity=".9">
        <path d="M22,330 Q2,328 -14,344"/><path d="M372,300 Q392,298 406,314"/><path d="M372,590 Q392,592 406,608"/>
      </g>
      <!-- затесь: светлая кромка и тёмная канавка -->
    <use href="#cuts" transform="translate(2.5 4)" stroke="#FFF4C9" stroke-opacity=".8"/>
    <use href="#cuts" stroke="#6B4322"/>
    <path d="M99,617 L278,618" fill="none" stroke="#2F1A0C" stroke-width="8" stroke-linecap="round" stroke-opacity=".75"/>

    <!-- выжженные рисунки -->
    <g fill="none" stroke="#4A2A14" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- двое -->
      <circle cx="93" cy="672" r="12"/><circle cx="140" cy="672" r="12"/>
      <path d="M93,684 L93,722 M93,700 L76,718 M93,722 L78,752 M93,722 L108,752"/>
      <path d="M93,700 L117,714 L140,702"/>
      <path d="M140,684 L140,726 M140,702 L162,719 M140,726 L125,760 M140,726 L156,758"/>
      <!-- олень -->
      <path d="M232,710 Q258,696 286,708 L272,750 Q258,768 244,750 Z"/>
      <path d="M232,712 Q218,706 214,716 Q224,722 236,720 M286,708 Q300,702 304,712 Q294,720 282,716"/>
      <path d="M240,704 Q214,690 198,650 M214,680 L194,674 M206,663 L222,650"/>
      <path d="M278,702 Q298,682 294,640 M291,664 L309,652 M294,646 L280,630"/>
    </g>
    <g fill="#4A2A14">
      <circle cx="247" cy="723" r="3.5"/><circle cx="270" cy="723" r="3.5"/>
      <ellipse cx="258" cy="752" rx="5" ry="4"/>
    </g>

    </g>
  </g>
  <circle cx="256" cy="256" r="247" fill="none" stroke="#1E140E" stroke-width="2.5" stroke-opacity=".8"/>
  <circle cx="256" cy="256" r="244.5" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5"/>
</svg>

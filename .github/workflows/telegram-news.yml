name: Website news collection
on:
  schedule:
    - cron: "0 5,11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = publish new stories to the site; digest = today's roundup"
        required: true
        type: choice
        options:
          - collect
          - digest
        default: collect
permissions:
  contents: write
concurrency:
  group: telegram-news
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out default branch
        id: checkout
        uses: actions/checkout@v4
      - name: Select run mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=collect" >> "$GITHUB_OUTPUT"
          fi
      - name: Run collector regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Search and update the website feed
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
        run: python3 scripts/telegram_news.py --mode "${{ steps.mode.outputs.value }}"
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-source-audit
          path: data/news-source-audit.json
          retention-days: 30
      - name: Save deduplication and daily digest state
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if git diff --quiet -- data/telegram-news-state.json news-data.js; then
            echo "No state changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telegram-news-state.json news-data.js
          git commit -m "Update news feed and Telegram collection state"
          git push
